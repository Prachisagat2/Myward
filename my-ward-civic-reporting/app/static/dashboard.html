<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Ward - Authority Dashboard</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --text:#1d2330; --muted:#6b7385; --line:#e3e6ec; --accent:#1f6feb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12151c; --card:#1b1f2a; --text:#e8ebf2; --muted:#98a1b3; --line:#2b3140; --accent:#58a6ff; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--text); }
  header { display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between; padding:16px 24px; background:var(--card); border-bottom:1px solid var(--line); }
  h1 { font-size:20px; margin:0; }
  .key { display:flex; gap:8px; align-items:center; font-size:13px; color:var(--muted); }
  input, select, button { font:inherit; padding:6px 10px; border:1px solid var(--line); border-radius:6px; background:var(--card); color:var(--text); }
  button { cursor:pointer; background:var(--accent); color:#fff; border-color:var(--accent); }
  main { padding:24px; max-width:1300px; margin:0 auto; }
  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; margin-bottom:20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px 16px; }
  .card .n { font-size:28px; font-weight:600; }
  .card .l { font-size:13px; color:var(--muted); }
  #msg { color:#d1242f; min-height:20px; margin-bottom:8px; font-size:14px; }
  .wrap { overflow-x:auto; background:var(--card); border:1px solid var(--line); border-radius:10px; }
  table { border-collapse:collapse; width:100%; font-size:14px; }
  th, td { padding:10px 12px; text-align:left; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--muted); font-weight:500; white-space:nowrap; }
  .pill { padding:2px 8px; border-radius:999px; font-size:12px; border:1px solid var(--line); }
  .High { color:#d1242f; border-color:#d1242f; }
  .Medium { color:#b08800; border-color:#b08800; }
  img.thumb { width:64px; height:48px; object-fit:cover; border-radius:6px; }
  details ul { margin:6px 0 0; padding-left:18px; color:var(--muted); font-size:12px; }
  .small { color:var(--muted); font-size:12px; }
</style>
</head>
<body>
<header>
  <h1>My Ward &mdash; Authority Dashboard</h1>
  <div class="key">
    <label for="key">Admin key</label>
    <input id="key" type="password" placeholder="only if the server requires one" size="26">
    <button id="save">Save</button>
    <span class="small" id="updated"></span>
  </div>
</header>
<main>
  <div class="cards" id="cards"></div>
  <div id="msg"></div>
  <div class="wrap">
    <table>
      <thead><tr>
        <th>ID</th><th>Photo</th><th>Category</th><th>Citizen</th><th>Ward</th>
        <th>Department</th><th>Priority</th><th>Status</th><th>Reported</th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</main>
<script>
const STATUSES = ["Submitted","Verified","Assigned","In Progress","Resolved","Reopened","Rejected"];
const $ = id => document.getElementById(id);
let adminKey = sessionStorage.getItem("adminKey") || "";
$("key").value = adminKey;

$("save").onclick = () => {
  adminKey = $("key").value.trim();
  sessionStorage.setItem("adminKey", adminKey);
  load();
};

const hdrs = (extra = {}) => adminKey ? { "X-Admin-Key": adminKey, ...extra } : extra;
const fmt = s => new Date(s.endsWith("Z") ? s : s + "Z").toLocaleString();

function el(tag, props = {}, ...kids) {
  const e = document.createElement(tag);
  Object.assign(e, props);
  kids.forEach(k => e.append(k));
  return e;
}

function renderStats(s) {
  const items = [["Total", s.total], ["Submitted", s.submitted], ["In progress", s.in_progress],
                 ["Resolved", s.resolved], ["High priority", s.high_priority]];
  $("cards").replaceChildren(...items.map(([l, n]) =>
    el("div", { className: "card" }, el("div", { className: "n", textContent: n }), el("div", { className: "l", textContent: l }))));
}

async function changeStatus(id, status, select, previous) {
  const note = prompt(`Note for status "${status}" (optional):`, "");
  if (note === null) { select.value = previous; return; }
  const r = await fetch(`/complaints/${id}/status`, {
    method: "PATCH",
    headers: hdrs({ "Content-Type": "application/json" }),
    body: JSON.stringify({ status, note: note || null }),
  });
  if (!r.ok) {
    const err = await r.json().catch(() => ({}));
    $("msg").textContent = err.detail || "Update failed.";
    select.value = previous;
    return;
  }
  load(true);
}

function renderRows(list) {
  $("rows").replaceChildren(...list.map(c => {
    const sel = el("select");
    STATUSES.forEach(s => sel.append(new Option(s, s, false, s === c.status)));
    sel.onchange = () => changeStatus(c.id, sel.value, sel, c.status);

    const hist = el("ul");
    c.history.forEach(h => hist.append(el("li", { textContent: `${h.status} - ${fmt(h.changed_at)}${h.note ? " - " + h.note : ""}` })));

    const photo = c.image_url
      ? el("a", { href: c.image_url, target: "_blank", rel: "noopener" }, el("img", { className: "thumb", src: c.image_url, alt: "complaint photo" }))
      : el("span", { className: "small", textContent: "none" });

    const statusCell = el("td", {}, sel, el("details", {}, el("summary", { className: "small", textContent: "History" }), hist));
    if (c.description) statusCell.append(el("div", { className: "small", textContent: c.description }));

    return el("tr", {},
      el("td", { textContent: "#" + c.id }),
      el("td", {}, photo),
      el("td", {}, c.category.replace("_", " "),
        c.category_source === "ai"
          ? el("div", { className: "small", textContent: "AI " + Math.round((c.ai_confidence || 0) * 100) + "%" })
          : ""),
      el("td", { textContent: c.citizen_name }),
      el("td", { textContent: c.ward_number }),
      el("td", { textContent: c.department }),
      el("td", {}, el("span", { className: "pill " + c.priority, textContent: c.priority })),
      statusCell,
      el("td", { className: "small", textContent: fmt(c.created_at) }));
  }));
}

async function load(force = false) {
  // Don't clobber a dropdown or open history panel while the user is using it.
  if (!force && (document.activeElement.tagName === "SELECT" || document.querySelector("details[open]"))) return;
  try {
    const [s, c] = await Promise.all([
      fetch("/stats", { headers: hdrs() }),
      fetch("/complaints", { headers: hdrs() }),
    ]);
    if (s.status === 401 || c.status === 401) {
      $("msg").textContent = "Admin key required or incorrect. Enter it above and press Save.";
      return;
    }
    $("msg").textContent = "";
    renderStats(await s.json());
    renderRows(await c.json());
    $("updated").textContent = "Updated " + new Date().toLocaleTimeString();
  } catch (e) {
    $("msg").textContent = "Could not reach the server.";
  }
}

load(true);
setInterval(load, 10000);
</script>
</body>
</html>
